# CI LauzHack 2026 : s'adapte tout seul a la stack (Gradle/KMP, Node, Python).
# Le check a exiger sur main s'appelle "ci-ok".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      gradle: ${{ steps.d.outputs.gradle }}
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "gradle=$([ -f gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f vision/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gradle:
    needs: detect
    if: needs.detect.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Compile + tests desktop (JVM) + build the Android debug APK. Faster than a full `build`.
      - run: ./gradlew :composeApp:desktopTest :composeApp:desktopJar :composeApp:assembleDebug --continue
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # vision/requirements.txt is NOT installed (mediapipe/opencv are heavy); ruff only checks syntax.
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - run: ruff check . --select E9,F63,F7,F82
      - run: if ls tests/ >/dev/null 2>&1 || ls test_*.py >/dev/null 2>&1; then pytest -q; else echo "pas de tests"; fi

  ci-ok:
    if: always()
    needs: [secret-scan, gradle, node, python]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Un job a echoue"; exit 1
          fi
